<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prode Mundialista</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <header>
    <h1>🏆 Prode Mundialista</h1>
    <nav id="main-nav">
        <button id="btn-fixture" class="active">Fixture</button>
        <button id="btn-ranking">Ranking</button>
        <button id="btn-grupos">Grupos</button>
        <button id="btn-goleadores">Goleadores</button>
        <button id="btn-logout" style="background: #e74c3c;">Salir</button>
    </nav>
</header>


    <main class="container">
        <section id="auth-section" class="card" style="max-width: 400px; margin: 2rem auto;">
            <h2 id="auth-title" style="text-align: center; margin-bottom: 1.5rem;">Iniciar Sesión</h2>
            
            <form id="auth-form">
                <div class="form-group" id="group-nombre" style="display: none;">
                    <label>Alias / Apodo:</label>
                    <input type="text" id="auth-nombre" placeholder="Ej: El Rayo">
                </div>
                
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="auth-email" required>
                </div>
                
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="auth-password" required>
                </div>
                
                <button type="submit" id="auth-submit-btn" class="btn-block">Ingresar</button>
            </form>
            
            <p style="text-align: center; margin-top: 15px;">
                <a href="#" id="toggle-auth" style="color: var(--primary-color); font-weight: bold; text-decoration: none;">¿No tienes cuenta? Regístrate aquí</a>
            </p>
        </section>

        <div id="app-content" class="hidden">
            
            <section id="fixture-section" class="view">
                <h2>Pronósticos del Mundial</h2>
                <p class="instruction">Ingresa tus predicciones antes del inicio de cada partido.</p>
                <div id="matches-container">
                </div>
            </section>

            <section id="ranking-section" class="view hidden">
                <h2>Tabla de Posiciones</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Puesto</th>
                                <th>Usuario</th>
                                <th>Puntos Totales</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-table-body">
                        </tbody>
                    </table>
                </div>
            </section>

            <section id="grupos-section" class="card hidden">
                <h2>Posiciones Oficiales</h2>
                <div id="grupos-container"></div>
            </section>

            <section id="goleadores-section" class="card hidden">
                <h2>Máximos Goleadores</h2>
                <div id="goleadores-container"></div>
            </section>

        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
