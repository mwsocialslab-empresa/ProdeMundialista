<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prode Mundialista</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🏆 Prode Mundialista</h1>
        <nav id="main-nav" class="hidden">
            <button id="btn-fixture" class="active">Fixture</button>
            <button id="btn-ranking">Ranking</button>
            <button id="btn-grupos">Grupos</button>
            <button id="btn-goleadores">Goleadores</button>
            <button id="btn-logout" style="background: #e74c3c; border-color: #e74c3c;">Salir</button>
        </nav>
    </header>

    <main class="container">
        <section id="auth-section" class="card">
            <h2>Ingresar al Sistema</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="alias">Apodo / Alias (Solo para nuevos usuarios)</label>
                    <input type="text" id="alias" placeholder="Ej: ElRayo43">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="password" required placeholder="Tu contraseña" style="width: 100%; padding-right: 40px;">
                        <button type="button" id="btn-toggle-pass" style="position: absolute; right: 10px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #7f8c8d; padding: 0;">👁️</button>
                    </div>
                </div>
                <button type="submit">Ingresar / Registrarse</button>
            </form>
        </section>

        <div id="app-content" class="hidden">
            
            <section id="fixture-section" class="view">
                <h2>Pronósticos del Mundial</h2>
                <p class="instruction">Ingresa tus predicciones antes del inicio de cada partido.</p>
                <div id="matches-container">
                </div>
            </section>

            <section id="ranking-section" class="view hidden">
                <h2>Tabla de Posiciones</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Puesto</th>
                                <th>Usuario</th>
                                <th>Puntos Totales</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-table-body">
                        </tbody>
                    </table>
                </div>
            </section>

            <section id="grupos-section" class="card hidden">
                <h2>Posiciones Oficiales</h2>
                <div id="grupos-container"></div>
            </section>

            <section id="goleadores-section" class="card hidden">
                <h2>Máximos Goleadores</h2>
                <div id="goleadores-container"></div>
            </section>

        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
